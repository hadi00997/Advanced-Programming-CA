<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Payment - E-Commerce App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
        .cart-item {
            border-bottom: 1px solid #ddd;
            padding: 10px 0;
        }

        .cart-item:last-child {
            border-bottom: none;
        }
    </style>
</head>

<body class="bg-light">
    <div id="navbar"></div>
    <div class="container py-5">
        <h2 class="mb-4">Payment Information</h2>

        <!-- Billing Address Form -->
        <div class="card mb-4">
            <div class="card-header">Billing Address</div>
            <div class="card-body">
                <form id="billingForm">
                    <div class="mb-3">
                        <label for="fullName" class="form-label">Full Name</label>
                        <input type="text" id="fullName" class="form-control" required />
                    </div>
                    <div class="mb-3">
                        <label for="address" class="form-label">Address</label>
                        <input type="text" id="address" class="form-control" required />
                    </div>
                    <div class="mb-3">
                        <label for="city" class="form-label">City</label>
                        <input type="text" id="city" class="form-control" required />
                    </div>
                    <div class="mb-3">
                        <label for="zipCode" class="form-label">Zip Code</label>
                        <input type="text" id="zipCode" class="form-control" required />
                    </div>
                </form>
            </div>
        </div>

        <!-- Payment Method Selection -->
        <div class="card mb-4">
            <div class="card-header">Payment Method</div>
            <div class="card-body">
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="paymentMethod" id="creditCard" value="creditCard"
                        checked>
                    <label class="form-check-label" for="creditCard">
                        Credit Card
                    </label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="paymentMethod" id="paypal" value="paypal">
                    <label class="form-check-label" for="paypal">
                        PayPal
                    </label>
                </div>
            </div>
        </div>

        <!-- Cart Summary -->
        <div class="card mb-4">
            <div class="card-header">Order Summary</div>
            <div class="card-body">
                <div id="cartItemsList"></div>
                <div class="d-flex justify-content-between mt-4">
                    <strong>Total:</strong>
                    <span id="totalAmount">$0.00</span>
                </div>
            </div>
        </div>

        <!-- Submit Payment -->
        <button class="btn btn-success w-100" onclick="processPayment()">Pay Now</button>
    </div>

    <script src="./js/api.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const cart = JSON.parse(localStorage.getItem('cart')) || [];
            const cartItemsList = document.getElementById('cartItemsList');
            const totalAmountElement = document.getElementById('totalAmount');

            if (cart.length === 0) {
                cartItemsList.innerHTML = '<p class="text-muted">Your cart is empty.</p>';
                totalAmountElement.textContent = '$0.00';
                return;
            }

            let totalAmount = 0;
            cart.forEach(item => {
                const cartItem = document.createElement('div');
                cartItem.className = 'cart-item';
                cartItem.innerHTML = `
          <div class="d-flex justify-content-between">
            <span>Product ${item.id}</span>
            <strong>$${(item.price * item.quantity).toFixed(2)}</strong>
          </div>
          <div class="text-muted">Quantity: ${item.quantity}</div>
        `;
                cartItemsList.appendChild(cartItem);
                totalAmount += item.price * item.quantity;
            });

            totalAmountElement.textContent = `$${totalAmount.toFixed(2)}`;
        });

        function processPayment() {
            alert("Payment Done!");
        }
    </script>
</body>

</html>
