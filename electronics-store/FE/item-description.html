<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
        .thumbnail-img {
            width: 70px;
            height: 70px;
            object-fit: cover;
            cursor: pointer;
            border: 2px solid transparent;
        }

        .thumbnail-img.active {
            border-color: #007bff;
        }
    </style>
</head>

<body class="bg-light">
    <div id="navbar"></div>

    <div class="container py-5">
        <a href="./welcome.html" class="btn btn-outline-secondary mb-4">← Back to Catalog</a>

        <div id="statusMsg"></div>
        <div class="row" id="product-details">
            <!-- Product details will be injected here -->
        </div>
    </div>

    <script src="./js/api.js"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const productId = params.get('id');
        document.addEventListener("DOMContentLoaded", async function () {
            const res = await fetchProduct(productId);
            if (!res.success || !res.data) {
                document.getElementById('product-details').innerHTML = `<p class="text-danger">Product not found.</p>`;
                return;
            }

            const product = res.data;
            const images = [product.image_url];

            document.getElementById('product-details').innerHTML = `
        <div class="col-md-6">
          <img id="mainImage" src="${images[0]}" class="img-fluid rounded shadow-sm mb-3" alt="${product.name}">
          <div class="d-flex gap-2 flex-wrap">
            ${images.map((img, i) => `
              <img src="${img}" class="thumbnail-img ${i === 0 ? 'active' : ''}" onclick="setMainImage(this, '${img}')">
            `).join('')}
          </div>
        </div>
        <div class="col-md-6">
          <h2>${product.name}</h2>
          <p class="text-muted">${product.description || 'No description provided.'}</p>
          <h4 class="text-primary">$${product.price}</h4>
           <div class="mt-4">
            <button class="btn btn-success" onclick='addToCart(${JSON.stringify(product)})'>Add to Cart</button>
            </div>
        </div >
      `;
        });

        const setMainImage = (el, src) => {
            document.getElementById('mainImage').src = src;
            document.querySelectorAll('.thumbnail-img').forEach(img => img.classList.remove('active'));
            el.classList.add('active');
        }


    </script>
</body>

</html>
