<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Home - E-Commerce App</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="./css/styles.css" />
</head>

<body class="bg-light">
  <div id="navbar"></div>


  <div class="container py-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
      <div id="statusMsg" class="text-success mt-2 text-center" style="display: none;"></div>
      <h2>All Products</h2>
      <button id="addProductBtn" class="btn btn-success d-none" onclick="window.location.href='add-product.html'">Add
        Product</button>
    </div>

    <div class="mb-4">
      <input type="text" id="searchInput" class="form-control" placeholder="Search products by name..." />
    </div>
    <div id="productGrid" class="row g-4">
      <!-- Products will be rendered here -->
    </div>
  </div>


  <script src="./js/api.js"></script>

  <script>
    let allProducts = []; // Will hold fetched products globally

    document.addEventListener("DOMContentLoaded", async function () {
      const role = JSON.parse(localStorage.getItem('data'));
      const isAdmin = role?.role === 'admin';
      const addBtn = document.getElementById('addProductBtn');
      if (isAdmin && addBtn) {
        addBtn.classList.remove('d-none');
      }

      const res = await fetchProducts();
      if (res.success && Array.isArray(res.data)) {
        allProducts = res.data;
        renderProducts(allProducts);
      } else {
        document.getElementById('productGrid').innerHTML = '<p class="text-danger">No products available.</p>';
      }

      document.getElementById('searchInput').addEventListener('input', function (e) {
        const searchTerm = e.target.value.toLowerCase();
        const filtered = allProducts.filter(product => product.name.toLowerCase().includes(searchTerm));
        renderProducts(filtered);
      });
    });

    function renderProducts(products) {
      const productGrid = document.getElementById('productGrid');
      productGrid.innerHTML = '';

      if (products.length === 0) {
        productGrid.innerHTML = '<p class="text-danger">No matching products found.</p>';
        return;
      }

      const isAdmin = JSON.parse(localStorage.getItem('data'))?.role === 'admin';

      products.forEach(product => {
        const col = document.createElement('div');
        col.className = 'col-md-4';
        col.innerHTML = `
                <div class="card h-100 shadow-sm rounded-4">
                    <img src="${product.image_url || 'https://via.placeholder.com/300x200'}" class="card-img-top" alt="${product.name}">
                    <div class="card-body d-flex flex-column">
                        <h5 class="card-title">${product.name}</h5>
                        <p class="card-text text-muted">${product.description || 'No description'}</p>
                        <div class="mt-auto d-flex justify-content-between align-items-center">
                            <strong>$${product.price}</strong>
                            ${isAdmin ?
            `<div class="btn-group">
                                    <button class="btn btn-sm btn-warning" onclick="editProduct('${product.id}')">Edit</button> &nbsp;
                                    <button class="btn btn-sm btn-danger" onclick="deleteProduct('${product.id}')">Delete</button>  &nbsp;
                                    <button class="btn btn-sm btn-primary" onclick='addToCart(${JSON.stringify(product)})'>Add to Cart</button> &nbsp;
                                    <button class="btn btn-sm btn-primary" onclick='productDetail(${product.id})'>Product Details</button>
                                </div>`
            :
            `<div class="btn-group">
                                  <button class="btn btn-sm btn-primary" onclick='addToCart(${JSON.stringify(product)})'>Add to Cart</button> &nbsp;
                                  <button class="btn btn-sm btn-primary" onclick='productDetail(${product.id})'>Product Details</button>
                                  </div>`
          }
                        </div>
                    </div>
                </div>`;
        productGrid.appendChild(col);
      });
    }

    function viewCart() {
      window.location.href = './cart.html';
    }

    function productDetail(id) {
      window.location.href = `./item-description.html?id=${id}`;
    }

    function editProduct(id) {
      window.location.href = `edit-product.html?id=${id}`;
    }
  </script>


</body>

</html>
